openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: 城市通勤系统 S9 API 契约
  version: 1.4.0
  description: |
    本文件保留 S2/S3 接口，并增加四个 S4 MySQL 交通统计接口。
    所有 examples 均为固定的契约示例，不是实时响应或真实交通采集结果。
    /health 是版本前缀与业务封套的明确例外；业务接口使用 /api/v1。
    HTTP 状态码表达协议结果，JSON code 是稳定的机器可读业务标识，两者不得混用。
    时间使用 RFC 3339（带时区的 ISO 8601），推荐 UTC Z；无时区本地时间不合法。
    所有 required 字段必须出现，null 不等于缺失；未声明字段不允许出现。
    S3 区分 dev_seed、synthetic_test、historical_snapshot、authorized_live 等来源；城市目录不等于道路观测。
    统计值来源由 meta 明示；S6 增加 Hive 已发布离线结果；S7 增加离线七日 CITY 日均拥堵指数预测，只读查询。
    S9 使用精确路径与方法授权、默认拒绝。未知路径由安全层直接返回统一404，不执行Controller；
    九个公开只读路径的非法写方法由安全层直接405并保留Allow GET/HEAD，不放行至Controller。
    auth/operations保留会话、CSRF及ADMIN/READER边界；详见docs/guides/s9-security.md。
servers:
  - url: http://localhost:8080
    description: 本机开发服务约定地址
security: []
tags:
  - name: health
    description: 无业务数据的健康探针
  - name: cities
    description: MySQL 城市目录
paths:
  /health:
    get:
      operationId: getHealth
      tags: [health]
      summary: 检查服务是否可用
      description: |
        HTTP 200 仅返回 status=UP 和请求处理时生成的 timestamp。
        不返回 code/message/data/meta，也不推断数据库或预测模块状态。
        不可用时返回 HTTP 503 的统一错误封套，而不是 HTTP 200 + DOWN。
      responses:
        '200':
          description: 服务可用；固定时间仅为契约示例
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              examples:
                healthy:
                  summary: 契约示例，非实时服务时间
                  externalValue: ./examples/health-success.json
                offset:
                  summary: 契约示例，合法的 +08:00 偏移
                  externalValue: ./examples/health-offset.json
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/cities:
    get:
      operationId: listCities
      tags: [cities]
      summary: 从 MySQL 读取城市列表
      description: |
        无请求体、分页或筛选参数。读取 city JOIN dataset_registry，按稳定 id 排序。
        城市 id 是稳定字符串，不是数据库自增数字；name 是显示名，不作为主键。
        无城市是正常结果：HTTP 200、code=OK、data=[]，不得用 null、404 或 204 替代。
        meta 基于数据库来源登记标识同质数据集；空目录标为 database_catalog/null，混合来源标为 mixed_catalog/null。dataAsOf 始终 null（城市目录非观测）。
        来源登记不构成外部授权证明；synthetic_test、simulation、mock、forecast 不能解释为真实观测。
      responses:
        '200':
          description: 数据库查询成功，允许空数组
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CitiesResponse'
              examples:
                cities:
                  summary: 合成测试城市列表，不是交通观测数据
                  externalValue: ./examples/cities-success.json
                empty:
                  summary: 成功但无城市，仍保留完整 meta
                  externalValue: ./examples/cities-empty.json
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/traffic/availability:
    get:
      operationId: trafficAvailability
      summary: Read city-associated datasets and actual observation bounds
      description: |
        Read-only repeatable-read metadata. Includes the city's registered default dataset and
        datasets with this city's observations or published current prediction; never unrelated cities.
        CITY/REGION/ROAD counts and inclusive UTC min/max timestamps remain independent.
        Empty levels use zero and null bounds. No dates are synthesized. Prediction cutoff is the
        exclusive cutoff of the current published model, only when registry source/version agree.
        meta contains requestId and three nulls because a response may span datasets.
        Reject missing/unknown/duplicate parameters, malformed/unknown/filtered city and request bodies.
      parameters:
      - in: query
        name: cityId
        required: true
        schema:
          type: string
          maxLength: 64
          pattern: ^[a-z][a-z0-9]*(?:-[a-z0-9]+)*$
      responses:
        '200':
          description: Registered and associated data availability
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailabilityResponse'
              examples:
                synthetic:
                  externalValue: ./examples/traffic-availability.json
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/traffic/summary:
    get:
      operationId: trafficSummary
      summary: Summary traffic analytics
      description: 'Single dataset (defaults to city registration), allowed sources:
        dev_seed/synthetic_test/historical_snapshot/authorized_live. No forecast/mock/simulation.
        UTC [from,to), millisecond precision, years 2000–2099, max 366 days (31 for
        hourly). Reject unknown/duplicate parameters, request bodies and invalid city/dataset/region.
        CITY, REGION, ROAD never mixed. Speed km/h, congestion 0–10. N is observations;
        arithmetic mean, no weighting. Series emits empty UTC buckets. Regions/roads
        retain unobserved catalog entities with null metrics. Roads ordered congestion
        DESC then id; literal substring search; total counts matching catalog roads.
        meta.dataAsOf is MAX observed_at across all matching observations, including
        roads outside the current page. Each response uses one repeatable-read snapshot;
        separate endpoints may observe separate commits. Registration is not external
        authorization verification.'
      parameters:
      - in: query
        name: cityId
        required: true
        schema: &pathid001
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[a-z][a-z0-9]*(?:-[a-z0-9]+)*$
      - in: query
        name: from
        required: true
        schema: &pathid002
          $ref: '#/components/schemas/ZonedTimestamp'
      - in: query
        name: to
        required: true
        schema: &pathid003
          $ref: '#/components/schemas/ZonedTimestamp'
      - in: query
        name: datasetId
        required: false
        schema: *pathid001
      responses:
        '200':
          description: Sample arithmetic means from MySQL; nullable metrics when N=0.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SummaryResponse'
              examples:
                synthetic:
                  externalValue: ./examples/traffic-summary.json
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/traffic/series:
    get:
