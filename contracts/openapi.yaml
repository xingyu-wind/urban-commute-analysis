        '503':
          description: Request rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/S8Error'
      description: Requires session-bound X-CSRF-TOKEN from GET /api/v1/auth/csrf. Refresh
        after login/logout. Operations mutations require ADMIN.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: false
              required:
              - username
              - password
              properties:
