  /api/v1/warehouse/metrics:
    get:
      operationId: warehouseMetrics
      summary: Read the current published Hive ADS snapshot
      description: Reads only the atomic current PUBLISHED release. Dataset defaults
        to city registration; same catalog source filter as S4. UTC release [from,to),
        observedTo is inclusive observed coverage. WINDOW/DAY/HOUR retain layer and
        target, SUM/count means rounded HALF_UP to 2 decimals. Road region comes from
        catalog, never merged into REGION. No release returns release=null and items=[].
        Max 10000 rows; larger result is rejected. Batch IDs and source hashes refer
        to the selected dataset in the full snapshot manifest. No forecasts or real
        commuter counts. Reject unknown/duplicate params and request bodies.
      parameters:
      - in: query
        name: cityId
        required: true
        schema:
          type: string
          pattern: ^[a-z][a-z0-9]*(-[a-z0-9]+)*$
          maxLength: 64
      - in: query
        name: datasetId
        required: false
        schema:
          type: string
          pattern: ^[a-z][a-z0-9]*(-[a-z0-9]+)*$
          maxLength: 64
      - in: query
        name: grain
        schema:
          type: string
          enum:
          - WINDOW
          - DAY
          - HOUR
          default: WINDOW
      responses:
        '200':
          description: Published Hive snapshot, or explicit unpublished empty state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WarehouseResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/predictions:
    get:
      operationId: getPredictions
      summary: 读取离线发布的未来连续七日拥堵指数
      description: Read-only, one repeatable-read transaction. CITY only; one dataset/version. UTC exclusive midnight
        cutoff; first forecast date equals cutoff date. dataAsOf is last actual observed timestamp. Unknown/duplicate
        parameters and bodies rejected. synthetic_test errors are demonstration only. Training never runs in HTTP.
        Older failed jobs never hide the published current model.
      parameters:
      - name: cityId
        in: query
        required: true
        schema:
          type: string
          pattern: ^[a-z][a-z0-9]*(-[a-z0-9]+)*$
          maxLength: 64
      - name: datasetId
        in: query
        required: false
        schema:
          type: string
          pattern: ^[a-z][a-z0-9]*(-[a-z0-9]+)*$
          maxLength: 64
      responses:
        '200':
          description: Published immutable CITY daily congestion model; release=null and empty arrays if no model.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PredictionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
