        schema:
          type: integer
          minimum: 1
          maximum: 10000
          default: 1
      - in: query
        name: pageSize
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 10
      responses:
        '200':
          description: Sample arithmetic means from MySQL; nullable metrics when N=0.
          content:
