name: S6 real HDFS Hive warehouse
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: s6-${{ github.ref }}
  cancel-in-progress: true
jobs:
  warehouse:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-ephemeral-only
        ports: ['33067:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-ephemeral-only"
          --health-interval=10s --health-timeout=5s --health-retries=15
    env:
      S3_ADMIN_PASSWORD: ci-ephemeral-only
      CONTRACT_PYTHON: python
      BROWSER_CHANNEL: chromium
      # Authorized by project owner in S6 chat: only fresh CI NameNode directories.
      S6_ALLOW_EMPTY_FORMAT: 'yes'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Install project dependencies
        run: |
          python -m pip install -r contracts/requirements.lock.txt -r data-pipeline/requirements.lock.txt
          npm ci --prefix frontend --no-audit --no-fund
          npm run build --prefix frontend
          echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/s6-playwright" >> "$GITHUB_ENV"
      - name: Install isolated Chromium
        working-directory: frontend
        run: npx --no-install playwright install chromium
      - name: Real ETL HDFS Hive reconciliation publication HTTP and browser
        run: python scripts/s3_database.py --with-restore-target --output backend/target/s6-db.json -- python scripts/s6_checks.py --release-checks --output backend/target/s6-ci
      - name: Preserve original diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: s6-warehouse-${{ github.run_id }}
          path: |
            backend/target/s6-ci/
            backend/target/s6-db.json
            backend/target/surefire-reports/
          retention-days: 14
